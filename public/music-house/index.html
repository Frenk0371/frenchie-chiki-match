<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Music House" />
  <meta name="description" content="Music House — musica, artisti, album e playlist per la famiglia." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./music-house-192.png" />
  <link rel="icon" type="image/png" href="./music-house-192.png" />
  <link rel="preconnect" href="https://musicbrainz.org" />
  <title>Music House</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./auth.css" />
  <link rel="stylesheet" href="./playlist.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="Vai alla home">
        <img src="./music-house-192.png" alt="" />
        <span><b>Music House</b><small>La tua musica, a casa tua.</small></span>
      </button>
      <button class="account-btn" id="accountBtn" aria-label="Account"><span id="accountGlyph">👤</span><small id="accountLabel">Account</small></button>
    </header>

    <main id="appContent" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button class="active" data-nav="home"><span>⌂</span><b>Home</b></button>
      <button data-nav="search"><span>⌕</span><b>Cerca</b></button>
      <button data-nav="library"><span>♡</span><b>Libreria</b></button>
      <button data-nav="playlists"><span>≡</span><b>Playlist</b></button>
    </nav>
  </div>

  <section id="playerShell" class="player-shell" aria-label="Player" hidden>
    <button class="player-grabber" id="expandPlayer" aria-label="Espandi player"></button>
    <div class="video-frame"><div id="ytPlayer"></div></div>
    <div class="now-meta" id="nowMeta"></div>
    <div class="player-controls">
      <button id="prevBtn" aria-label="Brano precedente">⏮</button>
      <button class="play-main" id="playPauseBtn" aria-label="Play o pausa">▶</button>
      <button id="nextBtn" aria-label="Brano successivo">⏭</button>
    </div>
    <div class="player-secondary">
      <button id="favoriteCurrentBtn">♡ Preferito</button>
      <button id="addCurrentBtn">＋ Playlist</button>
      <button id="closePlayerBtn">✕ Chiudi</button>
    </div>
  </section>

  <div class="modal-backdrop" id="playlistModal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="playlistTitle">
      <div class="modal-head"><h2 id="playlistTitle">Aggiungi a playlist</h2><button data-close-modal="playlistModal">✕</button></div>
      <div id="playlistChoices" class="playlist-choices"></div>
      <button class="secondary-btn" id="newPlaylistFromSheet">＋ Nuova playlist</button>
    </section>
  </div>

  <div class="modal-backdrop" id="accountModal" hidden>
    <section class="modal-card account-modal-card" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
      <div class="modal-head"><h2 id="accountTitle">Account Music House</h2><button data-close-modal="accountModal">✕</button></div>
      <div id="accountGuestView">
        <p class="help auth-intro">Accedi per tenere separate playlist, preferiti, album e cronologia di ogni persona della famiglia. Puoi continuare a usare Music House anche senza account.</p>
        <label class="field-label" for="displayName">Nome</label>
        <input id="displayName" class="text-field" type="text" autocomplete="name" placeholder="Es. Francesco" />
        <label class="field-label auth-gap" for="accountEmail">Email</label>
        <input id="accountEmail" class="text-field" type="email" autocomplete="email" placeholder="nome@email.it" />
        <label class="field-label auth-gap" for="accountPassword">Password</label>
        <input id="accountPassword" class="text-field" type="password" autocomplete="current-password" placeholder="Almeno 6 caratteri" />
        <div id="accountError" class="auth-error" hidden></div>
        <button class="primary-btn auth-action" id="signInBtn">Accedi</button>
        <button class="secondary-btn" id="signUpBtn">Crea account</button>
      </div>
      <div id="accountUserView" hidden>
        <div class="account-profile"><div class="account-avatar" id="accountAvatar">M</div><div><strong id="accountName">Music House</strong><small id="accountEmailCurrent"></small></div></div>
        <p class="help">Playlist, preferiti, album e cronologia vengono sincronizzati nel tuo profilo.</p>
        <button class="secondary-btn danger-btn" id="signOutBtn">Esci dall’account</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app-core.js"></script>
  <script src="./app-search-ui.js"></script>
  <script src="./app-search-api.js"></script>
  <script src="./app-library.js"></script>
  <script src="./app-auth.js"></script>
  <script src="./app-player.js"></script>
</body>
</html>
