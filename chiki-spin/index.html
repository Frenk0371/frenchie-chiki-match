*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#080912;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center}.app{width:min(100vw,520px);min-height:100vh;background:radial-gradient(circle at 50% 0,#68295f 0,#21132f 34%,#090a12 100%);overflow:hidden;position:relative}.spark{position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#ffc84a 0 1px,transparent 1.5px);background-size:57px 57px,79px 79px}.top{padding:10px;display:grid;grid-template-columns:.8fr 1.35fr 1fr auto;gap:6px;position:relative;z-index:2}.pill,.gear{height:45px;border-radius:14px;border:1px solid #8188a0;background:linear-gradient(#373b50,#181b29);box-shadow:0 3px 8px #0008;display:flex;align-items:center;justify-content:center;font-weight:900}.pill{font-size:14px}.gear{width:45px;font-size:20px}.hero{height:178px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:0 14px}.logo{text-align:center;font-family:Georgia,serif;font-style:italic;font-weight:900;line-height:.8;filter:drop-shadow(0 6px 0 #6f1c20)}.logo b{display:block;font-size:58px;background:linear-gradient(#fff7a8,#ffbd28,#ff7800);-webkit-background-clip:text;color:transparent;-webkit-text-stroke:1.3px #8c2d14}.logo i{display:block;font-size:50px;background:linear-gradient(#ffd2ee,#ff45a5,#c81467);-webkit-background-clip:text;color:transparent;-webkit-text-stroke:1.3px #79164c}.logo small{display:inline-block;margin-top:12px;background:#791242;border:2px solid #f7bd32;border-radius:20px;padding:5px 9px;font:800 10px system-ui;color:#ffe68a}.dog{text-align:center;font-size:94px;filter:drop-shadow(0 8px 15px #0009);position:relative}.dog:after{content:"💗 Chiki 💗";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font:900 11px system-ui;background:#ed3685;border:2px solid #ffd24b;border-radius:20px;padding:4px 10px;white-space:nowrap}.jack{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 7px}.j{border:2px solid #f2c247;border-radius:12px;padding:6px 2px;text-align:center;background:linear-gradient(#761632,#410b19);box-shadow:0 3px 7px #0008}.j:nth-child(2){background:linear-gradient(#692178,#2f143e)}.j:nth-child(3){background:linear-gradient(#24558e,#10263f)}.j:nth-child(4){background:linear-gradient(#128b50,#073923)}.j b{font-family:Georgia,serif;font-size:12px}.j span{display:block;font-size:11px;font-weight:950}.machine{margin:8px 7px 0;border:3px solid #e3a41b;border-radius:18px;padding:5px;background:#4d270a;box-shadow:0 0 0 2px #6e370d,0 8px 15px #000b}.reels{height:390px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#5d320d;padding:3px;border-radius:10px}.reel{display:grid;grid-template-rows:repeat(4,1fr);gap:3px}.cell{position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2c1d29,#0b090d 70%);border:1px solid #8f6020;overflow:hidden}.sym{font-size:45px;filter:drop-shadow(0 3px 2px #000)}.card{font-family:Georgia,serif;font-size:48px;font-weight:1000;color:#ffd74d;-webkit-text-stroke:1px #8c1e5d}.q{color:#ff4fa7}.jv{color:#5ab9ff}.k{color:#ff784d}.tag{position:absolute;bottom:4px;font-size:9px;font-weight:1000;border:1px solid #ffd04b;border-radius:6px;padding:2px 5px;background:#bd145d}.tag.s{background:#cb8200}.tag.b{background:#e77c00}.win{box-shadow:inset 0 0 18px #fff,0 0 17px #ffd53f;animation:p .45s alternate infinite}.win .sym{transform:scale(1.12)}@keyframes p{to{filter:brightness(1.7)}}.roll .sym{animation:r .1s linear infinite}@keyframes r{from{transform:translateY(-15px);filter:blur(1px)}to{transform:translateY(15px);filter:blur(1px)}}.board{height:76px;text-align:center;display:flex;flex-direction:column;justify-content:center}.board b{font-family:Georgia,serif;font-size:29px;color:#ffe75d;-webkit-text-stroke:1px #8d230d;text-shadow:0 2px #fff,0 5px #8d1d0a}.board span{font-size:24px;font-weight:1000;color:#fff0b5}.big b{font-size:37px;animation:b .5s alternate infinite}@keyframes b{to{transform:scale(1.08)}}.controls{padding:4px 10px 10px;display:grid;grid-template-columns:1fr 120px 1fr;gap:7px;align-items:center}.bet{height:70px;border:2px solid #7187bd;border-radius:16px;background:linear-gradient(#31477a,#18223e);display:grid;grid-template-columns:36px 1fr 36px;align-items:center;padding:5px}.bet button{height:44px;border:1px solid #6e86bf;border-radius:10px;background:linear-gradient(#425d9b,#213463);color:#fff;font-size:25px}.mid{text-align:center}.mid small{font-size:9px;color:#b7c5e9}.mid strong{display:block}.spin{width:106px;height:106px;border-radius:50%;border:5px solid #ffd440;background:radial-gradient(circle at 50% 30%,#53ff77,#17cb4c 43%,#08792d 75%);box-shadow:0 0 0 5px #533007,0 8px 0 #2e1905,0 10px 18px #000;color:white;font-size:26px;font-weight:1000;text-shadow:0 3px #064e1d}.spin:active{transform:translateY(5px)}.side{display:grid;gap:7px}.side button{height:34px;border-radius:13px;border:2px solid #c884ff;background:linear-gradient(#9a45df,#5e1a9c);color:#fff;font-weight:950}.side button+button{border-color:#ffd57e;background:linear-gradient(#ffb64e,#d16f0a)}.note{text-align:center;font-size:9px;color:#abb0c2;padding-bottom:9px}@media(max-height:760px){.hero{height:145px}.dog{font-size:76px}.logo b{font-size:48px}.logo i{font-size:42px}.reels{height:320px}.controls{grid-template-columns:1fr 100px 1fr}.spin{width:92px;height:92px}}
</style></head><body><div class="app"><div class="spark"></div><div class="top"><div class="pill">🐾 Lv. 28</div><div class="pill">🪙 <span id="credits">2,532,640</span></div><div class="pill">💎 1,250</div><button class="gear" id="sound">🔊</button></div><div class="hero"><div class="logo"><b>Chiki</b><i>Spin</i><small>🍌 BANANAS · PAWS · WIN 💗</small></div><div class="dog">🐶</div></div><div class="jack"><div class="j"><b>GRAND</b><span>1,250,000</span></div><div class="j"><b>MAJOR</b><span>125,000</span></div><div class="j"><b>MINOR</b><span>25,000</span></div><div class="j"><b>MINI</b><span>5,000</span></div></div><div class="machine"><div class="reels" id="reels"></div></div><div class="board" id="board"><b id="label">GOOD LUCK!</b><span id="amount">Premi SPIN</span></div><div class="controls"><div class="bet"><button id="minus">−</button><div class="mid"><small>TOTAL BET</small><strong id="bet">1,000</strong></div><button id="plus">+</button></div><button class="spin" id="spin">SPIN</button><div class="side"><button id="auto">AUTO PLAY</button><button id="bonus">🎁 BONUS</button></div></div><div class="note">Demo entertainment · crediti virtuali · nessun denaro reale</div></div><script>
(()=>{const S=[['banana','🍌',18],['paw','🐾',14,'SCATTER','s'],['wild','🐶',8,'WILD',''],['heart','💗',12],['ball','🎾',10],['house','🏠',8],['gift','🎁',7],['bone','🦴',9],['bowl','🥣',9],['bonus','🍌',6,'BONUS','b'],['A','A',8],['K','K',9],['Q','Q',9],['J','J',9]],P={banana:8,heart:6,ball:5,house:5,gift:7,bone:4,bowl:4,A:5,K:4,Q:4,J:3,wild:15,bonus:10,paw:8},W=[];S.forEach(s=>{for(let i=0;i<s[2];i++)W.push(s)});const $=x=>document.querySelector(x),R=$('#reels'),C=$('#credits'),B=$('#bet'),BD=$('#board'),L=$('#label'),A=$('#amount');let cred=2532640,bet=1000,sp=false,mut=false,au=false,ctx=null,timer=null;const fmt=n=>Math.floor(n).toLocaleString('en-US'),pick=()=>W[Math.floor(Math.random()*W.length)];function h(s){let cls=s[0]==='K'?'card k':s[0]==='Q'?'card q':s[0]==='J'?'card jv':s[0]==='A'?'card':'';return '<div class="sym '+cls+'">'+s[1]+'</div>'+(s[3]?'<div class="tag '+(s[4]||'')+'">'+s[3]+'</div>':'')}function build(){R.innerHTML='';for(let c=0;c<5;c++){let r=document.createElement('div');r.className='reel';for(let y=0;y<4;y++){let s=pick(),d=document.createElement('div');d.className='cell';d.dataset.id=s[0];d.innerHTML=h(s);r.appendChild(d)}R.appendChild(r)}}function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function tone(f,d=.08,type='square',g=.05,w=0){if(mut)return;ac();let o=ctx.createOscillator(),v=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,ctx.currentTime+w);v.gain.setValueAtTime(g,ctx.currentTime+w);v.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+w+d);o.connect(v).connect(ctx.destination);o.start(ctx.currentTime+w);o.stop(ctx.currentTime+w+d+.02)}function noise(d=.08,g=.02){if(mut)return;ac();let b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);let s=ctx.createBufferSource(),v=ctx.createGain();s.buffer=b;v.gain.value=g;s.connect(v).connect(ctx.destination);s.start()}function click(){tone(180,.03,'square',.04);tone(100,.04,'sine',.03,.02)}function stop(i){tone(95+i*14,.055,'square',.05);noise()}function whum(){for(let i=0;i<12;i++)tone(75+Math.random()*30,.08,'sawtooth',.012,i*.055)}function wwin(big){let n=big?[523,659,784,1047,1319]:[659,784,988,1175];n.forEach((f,i)=>tone(f,.18,'triangle',big?.075:.055,i*.09))}function rand(c){[...R.children[c].children].forEach(d=>{let s=pick();d.dataset.id=s[0];d.innerHTML=h(s)})}function check(){let g=[...Array(4)].map(()=>Array(5)),tot=0,w=[];for(let c=0;c<5;c++)for(let r=0;r<4;r++)g[r][c]=R.children[c].children[r];for(let r=0;r<4;r++){let ids=g[r].map(x=>x.dataset.id),base=ids.find(x=>x!=='wild')||'wild',n=0;for(let c=0;c<5;c++){if(ids[c]===base||ids[c]==='wild')n++;else break}if(n>=3){tot+=(P[base]||4)*bet/10*(n===5?6:n===4?3:1);for(let c=0;c<n;c++)w.push(g[r][c])}}let sc=[...R.querySelectorAll('.cell')].filter(x=>x.dataset.id==='paw');if(sc.length>=3){tot+=bet*3*sc.length;w.push(...sc)}let bo=[...R.querySelectorAll('.cell')].filter(x=>x.dataset.id==='bonus');if(bo.length>=3){tot+=bet*5;w.push(...bo)};[...new Set(w)].forEach(x=>x.classList.add('win'));return Math.floor(tot)}async function spin(){if(sp||cred<bet)return;sp=true;$('#spin').disabled=true;cred-=bet;C.textContent=fmt(cred);BD.classList.remove('big');L.textContent='SPINNING…';A.textContent='';R.querySelectorAll('.cell').forEach(x=>x.classList.remove('win'));click();whum();[...R.children].forEach(x=>x.classList.add('roll'));let ts=[];for(let i=0;i<5;i++)ts.push(setInterval(()=>rand(i),75));for(let i=0;i<5;i++){await new Promise(r=>setTimeout(r,220+i*90));clearInterval(ts[i]);rand(i);R.children[i].classList.remove('roll');stop(i)}await new Promise(r=>setTimeout(r,120));let win=check();if(win){cred+=win;C.textContent=fmt(cred);let big=win>=bet*8;BD.classList.toggle('big',big);L.textContent=big?'BIG WIN!':'WIN!';A.textContent=fmt(win);wwin(big)}else{L.textContent='GOOD LUCK!';A.textContent='Premi SPIN'}sp=false;$('#spin').disabled=false;if(au)timer=setTimeout(spin,650)}$('#spin').onclick=spin;$('#minus').onclick=()=>{if(sp)return;click();bet=Math.max(100,bet-100);B.textContent=fmt(bet)};$('#plus').onclick=()=>{if(sp)return;click();bet=Math.min(5000,bet+100);B.textContent=fmt(bet)};$('#sound').onclick=()=>{mut=!mut;$('#sound').textContent=mut?'🔇':'🔊';if(!mut)click()};$('#auto').onclick=()=>{au=!au;$('#auto').textContent=au?'STOP AUTO':'AUTO PLAY';if(au&&!sp)spin();else if(!au&&timer)clearTimeout(timer)};$('#bonus').onclick=()=>{click();L.textContent='BANANA BONUS';A.textContent='Trova 3 🍌 BONUS sui rulli!'};build()})();
</script></body></html>
