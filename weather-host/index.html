:root{color-scheme:dark}
body{letter-spacing:-.01em}
.wrap{max-width:760px;padding-left:18px;padding-right:18px}
header{align-items:center;padding:2px 2px 0}
.brand{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;font-size:31px;font-weight:780;letter-spacing:-1.15px;text-shadow:none}
.tag{font-size:10px;font-weight:700;letter-spacing:.16em;opacity:.72}
.topBtns{gap:10px}
.round{width:46px;height:46px;display:grid;place-items:center;border-radius:17px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.24);box-shadow:0 10px 30px rgba(4,46,78,.16),inset 0 1px 0 rgba(255,255,255,.2)}
.round svg{width:21px;height:21px;stroke:currentColor}
.hero{padding-top:31px}
.loc{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;font-size:27px;letter-spacing:-.6px}
.heart{font-size:18px;color:#ffe27a}
.temp{font-weight:250;letter-spacing:-8px}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.075));border-color:rgba(255,255,255,.20);box-shadow:0 20px 55px rgba(2,37,65,.17),inset 0 1px 0 rgba(255,255,255,.23)}
.card{border-radius:30px}
.nav{bottom:max(14px,env(safe-area-inset-bottom));width:min(calc(100% - 22px),700px);padding:7px;border-radius:26px;background:rgba(9,35,56,.80);border-color:rgba(255,255,255,.16);box-shadow:0 20px 50px rgba(3,18,31,.28),inset 0 1px 0 rgba(255,255,255,.10)}
.nav:before{display:none}
.nav button{min-height:62px;border-radius:20px;gap:4px;font-size:10.5px;color:#c6dce9}
.nav button i{width:31px;height:31px;border-radius:11px;font-size:0}
.nav button i svg{width:22px;height:22px;stroke:currentColor}
.nav button.on{background:rgba(255,255,255,.11);color:#fff}
.nav button.on i{background:transparent;box-shadow:none;color:#ffe58a}
.nav button.on:after{left:27%;right:27%;height:2px;bottom:3px}
.nav button.on span{color:#fff}
.sheet{background:linear-gradient(180deg,#174e73,#0c304a);border:1px solid rgba(255,255,255,.12);box-shadow:0 -25px 70px rgba(0,16,28,.32)}
.sheetHead b{font-size:21px}
.favList{display:grid;gap:10px;margin-top:16px}
.favRow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:13px 12px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10)}
.favRow .meta b,.favRow .meta small{display:block}
.favRow .meta small{margin-top:3px;opacity:.68}
.miniBtn{border:0;border-radius:13px;padding:10px 12px;background:rgba(255,255,255,.11);color:white}
.miniBtn.danger{color:#ffd1d1}
.primaryBtn{width:100%;margin-top:12px;border:0;border-radius:16px;padding:13px 14px;background:rgba(71,174,238,.30);color:white;font-weight:700}
.infoGrid{display:grid;gap:10px;margin-top:16px}
.infoCard{padding:15px;border-radius:19px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10)}
.infoCard h3{font-size:14px;margin:0 0 7px;opacity:.72;font-weight:650}
.infoCard p{margin:0;line-height:1.45;font-size:14px}
.infoName{font-size:28px;font-weight:800;letter-spacing:-.8px}
.infoVersion{opacity:.7;margin-top:3px}
.emptyState{text-align:center;padding:24px 12px 12px;opacity:.82}
.toast{position:fixed;z-index:250;left:50%;bottom:110px;transform:translateX(-50%);padding:11px 15px;border-radius:14px;background:rgba(6,27,43,.94);border:1px solid rgba(255,255,255,.15);box-shadow:0 14px 35px rgba(0,0,0,.25);font-size:13px;white-space:nowrap}

/* Atmosfera animata — solo presentazione, nessun impatto sul motore meteo */
.app.foggy{background:linear-gradient(180deg,#7893a2 0%,#9fb2bc 45%,#6b8796 100%)}
.app.night.rain{background:linear-gradient(180deg,#071727,#17364a 52%,#0a2335)}
.app.night.storm{background:linear-gradient(180deg,#050b14,#172330 52%,#070e16)}
.app.night.snow{background:linear-gradient(180deg,#17283a,#40586d 58%,#1c3145)}
.app.night.foggy{background:linear-gradient(180deg,#223342,#455965 50%,#263b49)}
.sky{isolation:isolate}
.cloud{animation:cloudDrift 16s ease-in-out infinite alternate;will-change:translate}
.c2{animation-duration:21s;animation-direction:alternate-reverse}
.c3{animation-duration:27s}
.sunny .sun{animation:sunPulse 5.8s ease-in-out infinite}
.rainfx,.snowfx,.fogfx,.lightning{display:none;position:absolute;pointer-events:none}
.rain .rainfx,.storm .rainfx{display:block;inset:-25% -18%;z-index:3;will-change:background-position}
.rainBack{opacity:.22;background-image:repeating-linear-gradient(103deg,transparent 0 27px,rgba(210,235,250,.42) 28px 30px,transparent 31px 58px);background-size:78px 130px;animation:rainFall .92s linear infinite;filter:blur(.45px)}
.rainFront{opacity:.42;background-image:repeating-linear-gradient(103deg,transparent 0 42px,rgba(235,247,255,.62) 43px 45px,transparent 46px 86px);background-size:104px 165px;animation:rainFall .56s linear infinite}
.wx-light .rainBack{opacity:.15}.wx-light .rainFront{opacity:.25;animation-duration:.76s}
.wx-medium .rainBack{opacity:.25}.wx-medium .rainFront{opacity:.46}
.wx-heavy .rainBack{opacity:.36}.wx-heavy .rainFront{opacity:.66;animation-duration:.42s}
.storm .rainBack{opacity:.38}.storm .rainFront{opacity:.72;animation-duration:.38s}
.storm .lightning{display:block;inset:0;z-index:1;background:radial-gradient(circle at 72% 12%,rgba(255,255,255,.92) 0,rgba(208,230,255,.42) 16%,rgba(170,205,235,.10) 36%,transparent 58%);mix-blend-mode:screen;opacity:0;animation:stormFlash 7.6s infinite}
.snow .snowfx{display:block;inset:-18% -12%;z-index:3;will-change:background-position,translate}
.snowBack{opacity:.44;background-image:radial-gradient(circle,rgba(255,255,255,.92) 0 1.3px,transparent 1.7px),radial-gradient(circle,rgba(240,249,255,.78) 0 1.8px,transparent 2.2px);background-size:42px 48px,76px 84px;background-position:0 -80px,18px -160px;animation:snowFallBack 13s linear infinite;filter:blur(.15px)}
.snowFront{opacity:.76;background-image:radial-gradient(circle,rgba(255,255,255,.98) 0 2.3px,transparent 2.8px),radial-gradient(circle,rgba(250,253,255,.88) 0 3.2px,transparent 3.8px);background-size:92px 106px,138px 148px;background-position:22px -110px,65px -230px;animation:snowFallFront 9.2s linear infinite;filter:drop-shadow(0 1px 2px rgba(90,130,160,.18))}
.wx-light .snowFront{opacity:.52;animation-duration:11.5s}.wx-heavy .snowFront{opacity:.9;animation-duration:7.4s}
.foggy .fogfx{display:block;z-index:2;width:165%;left:-32%;height:26%;border-radius:50%;background:linear-gradient(90deg,transparent 0%,rgba(235,246,250,.18) 12%,rgba(245,251,253,.43) 38%,rgba(220,236,242,.30) 64%,rgba(245,251,253,.18) 82%,transparent 100%);filter:blur(24px);will-change:translate,opacity}
.fogA{top:10%;opacity:.72;animation:fogDriftA 17s ease-in-out infinite alternate}
.fogB{top:37%;opacity:.58;animation:fogDriftB 23s ease-in-out infinite alternate-reverse}
.fogC{top:66%;opacity:.46;animation:fogDriftA 29s ease-in-out infinite alternate}
.foggy .sky:after{background:linear-gradient(180deg,rgba(224,239,245,.16),rgba(212,230,237,.22) 48%,rgba(109,140,153,.18));backdrop-filter:blur(1.2px)}
.foggy .cloud{opacity:.12}
.foggy .sun{opacity:.18;filter:blur(3px) drop-shadow(0 0 35px rgba(255,245,205,.30))}
@keyframes cloudDrift{from{translate:-42px 2px}to{translate:54px -8px}}
@keyframes sunPulse{0%,100%{filter:drop-shadow(0 0 38px rgba(255,223,114,.42))}50%{filter:drop-shadow(0 0 58px rgba(255,231,143,.64))}}
@keyframes rainFall{from{background-position:0 -210px}to{background-position:52px 210px}}
@keyframes snowFallBack{0%{background-position:0 -180px,18px -320px;translate:-10px 0}50%{translate:12px 0}100%{background-position:24px 950px,-18px 1180px;translate:-5px 0}}
@keyframes snowFallFront{0%{background-position:22px -220px,65px -430px;translate:10px 0}50%{translate:-15px 0}100%{background-position:-28px 1080px,14px 1390px;translate:8px 0}}
@keyframes fogDriftA{from{translate:-9% -4px;opacity:.42}to{translate:9% 5px;opacity:.78}}
@keyframes fogDriftB{from{translate:7% 3px;opacity:.34}to{translate:-11% -3px;opacity:.68}}
@keyframes stormFlash{0%,72%,75%,100%{opacity:0}73%{opacity:.72}73.7%{opacity:.08}74.2%{opacity:.46}74.7%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cloud,.sun,.rainfx,.snowfx,.fogfx,.lightning{animation:none!important}.rainfx,.snowfx,.fogfx,.lightning{display:none!important}}

async function favoritePreview(x){
  if(weather&&sameLoc(x,loc)){
    const c=weather.current;
    return{temp:Math.round(c.temp),code:c.code,pop:Math.round(c.pop||0),isDay:c.isDay};
  }
  const u=new URL('https://api.open-meteo.com/v1/forecast');
  u.searchParams.set('latitude',x.latitude);
  u.searchParams.set('longitude',x.longitude);
  u.searchParams.set('timezone',x.timezone||'auto');
  u.searchParams.set('forecast_days','2');
  u.searchParams.set('hourly','temperature_2m,precipitation_probability,weather_code,is_day');
  const r=await fetch(u);if(!r.ok)throw Error('preview');
  const j=await r.json(),h=j.hourly;
  const tz=x.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone;
  const now=new Date().toLocaleString('sv-SE',{timeZone:tz}).replace(' ','T').slice(0,13)+':00';
  let i=h.time.findIndex(t=>t>=now);if(i<0)i=0;
  return{temp:Math.round(h.temperature_2m[i]),code:h.weather_code[i],pop:Math.round(h.precipitation_probability[i]||0),isDay:h.is_day[i]};
}
async function loadFavoritePreviews(f){
  await Promise.all(f.map(async(x,i)=>{
    const el=document.getElementById('favWx'+i);if(!el)return;
    try{
      const w=await favoritePreview(x);
      if(!document.getElementById('favWx'+i))return;
      el.innerHTML=wi(w.code,w.isDay)+'<div class="favWxText"><b>'+w.temp+'°</b><small>'+label(w.code)+' · '+w.pop+'%</small></div>';
    }catch(e){
      if(document.getElementById('favWx'+i))el.innerHTML='<div class="favLoading">Apri per vedere</div>';
    }
  }));
}

let radarMap=null,radarLayer=null,radarFrames=[],radarFrameIndex=0,radarTimer=null,radarMeta=null;
function stopRadar(){
  if(radarTimer){clearInterval(radarTimer);radarTimer=null}
  if(radarMap){try{radarMap.remove()}catch(e){} radarMap=null}
  radarLayer=null;radarFrames=[];radarMeta=null;
}
function closeRadar(){
  stopRadar();
  document.getElementById('radarBg')?.remove();
  setActiveTab('tabToday');
}
function ensureLeaflet(){
  if(window.L)return Promise.resolve();
  if(!document.querySelector('link[data-leaflet]')){
    const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';l.dataset.leaflet='1';document.head.appendChild(l);
  }
  return new Promise((resolve,reject)=>{
    if(window.L)return resolve();
    let s=document.querySelector('script[data-leaflet]');
    if(s){
      s.addEventListener('load',()=>resolve(),{once:true});
      s.addEventListener('error',()=>reject(Error('leaflet')),{once:true});
      return;
    }
    s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.dataset.leaflet='1';s.onload=()=>resolve();s.onerror=()=>reject(Error('leaflet'));document.head.appendChild(s);
  });
}
function radarFrameLabel(frame){
  if(!frame)return'';
  const tz=loc.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone;
  return new Intl.DateTimeFormat('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:tz}).format(new Date(frame.time*1000));
}
function setRadarFrame(i){
  if(!radarMap||!radarFrames.length||!radarMeta)return;
  radarFrameIndex=Math.max(0,Math.min(radarFrames.length-1,i));
  if(radarLayer){radarMap.removeLayer(radarLayer);radarLayer=null}
  const f=radarFrames[radarFrameIndex];
  radarLayer=L.tileLayer(radarMeta.host+f.path+'/256/{z}/{x}/{y}/2/1_1.png',{
    tileSize:256,opacity:.72,maxZoom:7,maxNativeZoom:7,zIndex:450
  }).addTo(radarMap);
  const t=document.getElementById('radarTime');if(t)t.textContent=radarFrameLabel(f);
  const r=document.getElementById('radarRange');if(r)r.value=radarFrameIndex;
}
function toggleRadarPlay(){
  const b=document.getElementById('radarPlay');if(!b)return;
  if(radarTimer){clearInterval(radarTimer);radarTimer=null;b.textContent='▶';return}
  b.textContent='❚❚';
  radarTimer=setInterval(()=>{
    if(!document.getElementById('radarBg')){stopRadar();return}
    let n=radarFrameIndex+1;if(n>=radarFrames.length)n=0;setRadarFrame(n);
  },800);
}
async function openRadar(){
  stopRadar();
  document.getElementById('radarBg')?.remove();
  setActiveTab('tabRadar');
  document.body.insertAdjacentHTML('beforeend',`<div class="sheetBg" id="radarBg"><div class="sheet radarSheet"><div class="sheetHead"><div><b>Radar pioggia</b><div class="radarLead">Movimento delle precipitazioni nelle ultime 2 ore</div></div><button id="closeRadar">✕</button></div><div class="radarMapWrap"><div id="radarMap"><div class="radarStatus">Caricamento radar…</div></div><div class="radarTime" id="radarTime">--:--</div><div class="radarLoc">${loc.name}</div></div><div class="radarControls"><button class="radarCtl" id="radarPrev">‹</button><button class="radarCtl play" id="radarPlay">▶</button><button class="radarCtl" id="radarNext">›</button><input class="radarRange" id="radarRange" type="range" min="0" max="0" value="0" aria-label="Orario radar"></div><div class="radarFoot"><span>I fotogrammi mostrano osservazioni radar passate, non una previsione futura.</span><span>Radar: <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a> · Mappa: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></span></div></div></div>`);
  document.getElementById('closeRadar').onclick=closeRadar;

  }

async function ensureExtraWeather(){

function radarNowKey(){return Number(loc.latitude).toFixed(4)+','+Number(loc.longitude).toFixed(4)}

function radarTimeLabel(ts){

}
function radarTilePoint(lat,lon,z=7){
  const n=2**z;
  const safeLat=Math.max(-85.05112878,Math.min(85.05112878,Number(lat)));
  const latRad=safeLat*Math.PI/180;
  const xf=(Number(lon)+180)/360*n;
  const yf=(1-Math.log(Math.tan(latRad)+1/Math.cos(latRad))/Math.PI)/2*n;
  const x=Math.floor(xf),y=Math.floor(yf);
  return{z,x,y,px:(xf-x)*256,py:(yf-y)*256};
}
function sampleRadarImage(img,px=128,py=128){
  const c=document.createElement('canvas');c.width=256;c.height=256;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,256,256);
  const d=x.getImageData(0,0,256,256).data,cx=Math.round(px),cy=Math.round(py);
  let localPixels=0,nearPixels=0,strongPixels=0;
  for(let yy=-12;yy<=12;yy++){
    for(let xx=-12;xx<=12;xx++){
      const dist=Math.hypot(xx,yy);if(dist>12)continue;
      const sx=cx+xx,sy=cy+yy;if(sx<0||sx>=256||sy<0||sy>=256)continue;
      const i=(sy*256+sx)*4,a=d[i+3];
      if(a<24)continue;
      nearPixels++;
      if(dist<=3)localPixels++;
      const brightness=(d[i]+d[i+1]+d[i+2])/3;
      if(dist<=5&&a>110&&brightness>70)strongPixels++;
    }
  }
  if(localPixels>=2)return{wet:true,local:true,sparse:localPixels<8&&nearPixels<55,strong:strongPixels};
  if(nearPixels>=10)return{wet:true,local:false,sparse:nearPixels<55,strong:strongPixels};
  return{wet:false,local:false,sparse:true,strong:strongPixels};
}
function loadRadarSample(host,frame,tile){
  return new Promise((resolve,reject)=>{
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{try{resolve({...sampleRadarImage(img,tile.px,tile.py),frameTime:frame.time})}catch(e){reject(e)}};
    img.onerror=()=>reject(Error('radar-image'));
    img.src=host+frame.path+'/256/'+tile.z+'/'+tile.x+'/'+tile.y+'/2/0_1.png';
  });
}
const RADAR_REFRESH_MS=120000;
async function ensureRadarNow(force=false){
  const key=radarNowKey(),old=radarNow.key===key?radarNow.data:null;
  if(radarNow.key===key&&radarNow.loading)return;
  if(!force&&old?.checkedAt&&Date.now()-old.checkedAt<RADAR_REFRESH_MS)return;
  radarNow={key,data:old,loading:true};
  try{
    const r=await fetch('https://api.rainviewer.com/public/weather-maps.json',{cache:'no-store'});
    if(!r.ok)throw Error('radar-meta');
    const m=await r.json(),frames=m?.radar?.past||[];
    if(frames.length<2)throw Error('radar-frames');
    const recentFrames=frames.slice(-4);
    const tile=radarTilePoint(loc.latitude,loc.longitude,7);
    const history=await Promise.all(recentFrames.map(f=>loadRadarSample(m.host,f,tile)));
    if(radarNowKey()!==key)return;

    const latest=history[history.length-1];
    const previous=history[history.length-2];
    const ageSeconds=Math.max(0,Date.now()/1000-latest.frameTime);
    const stale=ageSeconds>1200;

    // A local signal is promoted only after two consecutive radar frames agree.
    // This prevents a single weak/noisy echo from being presented as rain at ground level.
    const localCandidate=!stale&&latest.local;
    const local=localCandidate&&!!previous?.local;
    const wet=!stale&&latest.wet;

    let text='';
    if(wet){
      if(local){
        text=latest.sparse?'Debole segnale di precipitazione rilevato in zona':'Segnale di precipitazione rilevato in zona';
      }else if(localCandidate){
        text='Segnale radar di precipitazione vicino alla località';
      }else{
        text=latest.sparse?'Debole segnale di precipitazione nei dintorni':'Segnale di precipitazione nei dintorni';
      }
    }

    radarNow={key,data:{...latest,wet,local,stale,text,time:radarTimeLabel(latest.frameTime),checkedAt:Date.now()},loading:false};
    render();
  }catch(e){
    if(radarNowKey()!==key)return;
    radarNow={key,data:{wet:false,local:false,unavailable:true,checkedAt:Date.now()},loading:false};
  }
}
function fmtMm(v){v=Number(v)||0;if(v<.05)return'0 mm';return(v<10?v.toFixed(1):Math.round(v))+' mm'}
function dayStats(hs){
  const vals=k=>hs.map(h=>Number(h[k])).filter(Number.isFinite);
  const avg=k=>{const a=vals(k);return a.length?Math.round(a.reduce((s,v)=>s+v,0)/a.length):0};
  const max=k=>{const a=vals(k);return a.length?Math.max(...a):0};
  const feels=vals('feels');
  return{
    feelsMin:feels.length?Math.round(Math.min(...feels)):0,
    feelsMax:feels.length?Math.round(Math.max(...feels)):0,
    rain:hs.reduce((s,h)=>s+(Number.isFinite(Number(h.precip))?Number(h.precip):0),0),
    maxPop:max('pop'),
    humidity:avg('humidity'),
    gust:Math.round(max('gust')),
    cloud:avg('cloud')
  };
}
function briefCondition(hs){
  if(!hs.length)return'';
  const maxPop=Math.max(...hs.map(h=>Number(h.pop)||0));
  const rainMm=hs.reduce((s,h)=>s+(Number(h.precip)||0),0);
  const storm=hs.filter(h=>Number(h.code)>=95&&Number(h.pop)>=40).length;
  const snow=hs.filter(h=>Number(h.code)>=71&&Number(h.code)<=77).length;
  const fog=hs.filter(h=>Number(h.code)>=45&&Number(h.code)<=48).length;
  const wet=hs.filter(h=>Number(h.code)>=51&&(Number(h.pop)>=35||(Number(h.precip)||0)>=.2)).length;
  const cloud=hs.map(h=>Number(h.cloud)).filter(Number.isFinite);
  const avgCloud=cloud.length?cloud.reduce((a,b)=>a+b,0)/cloud.length:50;
  if(storm)return'con possibili temporali';
  if(snow)return'con possibili nevicate';
  if(wet>=Math.max(1,Math.ceil(hs.length*.25))&&(maxPop>=35||rainMm>=.5))return'con possibili rovesci';
  if(fog>=Math.max(1,Math.ceil(hs.length*.35)))return'con nebbia';
  if(avgCloud>=78)return'nuvoloso';
  if(avgCloud>=38)return'con qualche nube';
  return'sereno';
}
function todayBrief(hours,daily){
  if(!hours?.length)return{title:'Oggi in breve',text:'Dettagli non disponibili.'};
  const today=hours[0].time.slice(0,10);
  const hs=hours.filter(h=>h.time.slice(0,10)===today);
  const groups=[
    ['Mattina',hs.filter(h=>+h.time.slice(11,13)>=6&&+h.time.slice(11,13)<12)],
    ['Pomeriggio',hs.filter(h=>+h.time.slice(11,13)>=12&&+h.time.slice(11,13)<18)],
    ['Sera',hs.filter(h=>+h.time.slice(11,13)>=18&&+h.time.slice(11,13)<=23)]
  ].filter(x=>x[1].length).map(([name,g])=>({name,cond:briefCondition(g)}));
  let text='';
  if(!groups.length){
    text='Giornata quasi conclusa.';
  }else{
    const chunks=[];
    for(let i=0;i<groups.length;){
      let j=i;
      while(j+1<groups.length&&groups[j+1].cond===groups[i].cond)j++;
      const names=groups.slice(i,j+1).map(x=>x.name.toLowerCase());
      let when;
      if(names.length===1)when=(i===0?groups[i].name:names[0]);
      else if(names.length===2)when=(i===0?groups[i].name:names[0])+' e '+names[1];
      else when=(i===0?groups[i].name:names[0])+', '+names.slice(1,-1).join(', ')+' e '+names[names.length-1];
      chunks.push(when+' '+groups[i].cond);
      i=j+1;
    }
    text=chunks.join(', ')+'.';
  }
  if(daily&&Number.isFinite(Number(daily.max)))text+=' Massima '+Math.round(daily.max)+'°.';
  return{title:'Oggi in breve',text};
}
function rainInsight(hours){
  const hs=(hours||[]).slice(0,24);
  if(!hs.length)return{wet:false,heading:'Precipitazioni',title:'Dati non disponibili',detail:'Riprova tra poco'};
  const significant=h=>{
    const pop=Number(h.pop)||0,mm=Number(h.precip)||0,code=Number(h.code)||0;
    return (pop>=35&&(code>=51||mm>=.2))||(pop>=20&&mm>=.7);
  };
  const first=hs.findIndex(significant);
  if(first<0)return{wet:false,heading:'Quando pioverà?',title:'Nessuna pioggia significativa prevista',detail:'Nelle prossime 24 ore'};
  let end=first,lastWet=first,gap=0;
  for(let i=first+1;i<hs.length;i++){
    if(significant(hs[i])){lastWet=i;end=i;gap=0}
    else if(gap<1){gap++;end=i}
    else break;
  }
  end=lastWet;
  const seg=hs.slice(first,end+1),maxPop=Math.max(...seg.map(h=>Number(h.pop)||0));
  const total=seg.reduce((s,h)=>s+(Number(h.precip)||0),0);
  const snowHours=seg.filter(h=>Number(h.code)>=71&&Number(h.code)<=77&&significant(h)).length;
  const rainHours=seg.filter(h=>Number(h.code)>=51&&!(Number(h.code)>=71&&Number(h.code)<=77)&&significant(h)).length;
  const isSnow=snowHours>rainHours&&snowHours>0;
  const mixed=snowHours>0&&rainHours>0&&snowHours===rainHours;
  const refDay=hs[0].time.slice(0,10),startDay=hs[first].time.slice(0,10);
  const diff=Math.round((new Date(startDay+'T12:00')-new Date(refDay+'T12:00'))/86400000);
  const dayWord=diff===0?'oggi':diff===1?'domani':new Intl.DateTimeFormat('it-IT',{weekday:'long'}).format(new Date(startDay+'T12:00'));
  const t0=hs[first].time.slice(11,16),t1=hs[end].time.slice(11,16);
  let when=first===0?'Adesso':(first===end?dayWord+' intorno alle '+t0:dayWord+' dalle '+t0+' alle '+t1);
  let heading,kind;
  if(isSnow){
    heading='Quando nevicherà?';
    kind=maxPop>=70||total>=3?'Neve probabile':'Possibili nevicate';
  }else if(mixed){
    heading='Precipitazioni';
    kind=maxPop>=70||total>=3?'Pioggia e neve probabili':'Possibili pioggia e neve';
  }else{
    heading='Quando pioverà?';
    kind=maxPop>=70||total>=3?'Pioggia probabile':'Possibili rovesci';
  }
  return{wet:true,heading,title:kind+' · '+when,detail:'Picco '+Math.round(maxPop)+'% · '+fmtMm(total)+' nel periodo'};
}

async function searchCity(q){if(q.trim().length<2){$('#results').innerHTML='';return}let u=new URL('https://geocoding-api.open-meteo.com/v1/search');u.searchParams.set('name',q);u.searchParams.set('count','7');u.searchParams.set('language','it');let r=await fetch(u),j=await r.json();$('#results').innerHTML=(j.results||[]).map((x,i)=>`<button data-i="${i}"><b>${x.name}</b><small>${[x.admin1,x.country].filter(Boolean).join(', ')}</small></button>`).join('');[...$('#results').children].forEach((b,i)=>b.onclick=()=>choose(j.results[i],searchMode))}
function choose(x,mode='select'){loc={name:x.name,admin1:x.admin1,country:x.country,latitude:x.latitude,longitude:x.longitude,timezone:x.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone};localStorage.setItem('mw-location',JSON.stringify(loc));if(mode==='favorite'){const added=addFavoriteLocation(loc);showToast(added?'Aggiunta ai preferiti':'Località già nei preferiti')}closeSearch();load()}
const _consensusBase=consensus;
consensus=function(models){
  const out=_consensusBase(models);
  if(!out?.daily?.length||!out?.hourly?.length)return out;
  out.daily=out.daily.map(d=>{
    if(d.code<95)return d;
    const hs=out.hourly.filter(h=>h.time.slice(0,10)===d.date&&+h.time.slice(11,13)>=8&&+h.time.slice(11,13)<=20);
    if(!hs.length)return d;
    const stormHours=hs.filter(h=>h.code>=95&&h.pop>=60);
    const stormCoverage=stormHours.length/hs.length;
    if(d.pop>=50&&stormHours.length>=2&&stormCoverage>=0.15)return d;
    const wet=hs.filter(h=>h.code>=51||h.pop>=45||h.precip>=0.2);
    const wetCoverage=wet.length/hs.length;
    if(d.pop>=35&&wetCoverage>=0.20)return {...d,code:80};
    const dry=hs.filter(h=>h.code<51);
    const clouds=(dry.length?dry:hs).map(h=>h.cloud).filter(Number.isFinite);
    const avgCloud=clouds.length?clouds.reduce((a,b)=>a+b,0)/clouds.length:50;
    return {...d,code:avgCloud>=82?3:avgCloud>=45?2:avgCloud>=18?1:0};
  });
  return out;
};
