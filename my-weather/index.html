<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d72ba"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="My Weather"><title>My Weather</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#0b6fb3;color:#fff}button,input{font:inherit}button{cursor:pointer}.app{min-height:100svh;position:relative;overflow:hidden;background:linear-gradient(180deg,#1494e6 0%,#57b6ec 48%,#1d78bb 100%);transition:.5s}.app.cloudy{background:linear-gradient(180deg,#5b89aa,#91b1c8 52%,#477895)}.app.rain{background:linear-gradient(180deg,#335f7b,#5f89a3 52%,#2a5068)}.app.storm{background:linear-gradient(180deg,#172d3e,#40586a 50%,#142431)}.app.night{background:linear-gradient(180deg,#06152d,#173759 55%,#07172b)}.app.snow{background:linear-gradient(180deg,#7899b8,#c4d9e8 60%,#728ca4)}.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}.sky:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,55,104,.05),rgba(0,65,112,.08) 55%,rgba(0,42,73,.18));}.sun{position:absolute;right:-35px;top:105px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#fff 0 9%,#fff7c9 15%,#ffd84f 40%,rgba(255,205,63,.18) 65%,transparent 68%);filter:drop-shadow(0 0 42px rgba(255,223,114,.48));opacity:.9}.cloud{position:absolute;width:190px;height:70px;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:65px 5px 0 18px rgba(255,255,255,.60),120px -18px 0 34px rgba(255,255,255,.55),180px 8px 0 14px rgba(255,255,255,.34);filter:blur(.3px)}.c1{right:-70px;top:300px;opacity:.48}.c2{left:-120px;top:520px;transform:scale(1.5);opacity:.2}.c3{right:5%;top:52%;transform:scale(.75);opacity:.14}.rain .rainfx,.storm .rainfx{position:absolute;inset:0;background:repeating-linear-gradient(102deg,transparent 0 30px,rgba(210,236,255,.13) 31px 33px,transparent 34px 64px);animation:fall 1.2s linear infinite}.night .sun,.rain .sun,.storm .sun{opacity:.09}.wrap{position:relative;z-index:2;max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(104px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:flex-start}.brand{font:700 34px Georgia,serif;letter-spacing:-.8px;text-shadow:0 3px 16px rgba(0,0,0,.10)}.tag{font-size:9px;letter-spacing:.28em;margin-top:7px;opacity:.8}.topBtns{display:flex;gap:9px}.round{width:44px;height:44px;border:1px solid rgba(255,255,255,.28);border-radius:50%;background:rgba(255,255,255,.13);color:#fff;backdrop-filter:blur(18px);font-size:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 28px rgba(0,62,112,.12)}.hero{position:relative;padding:28px 2px 16px;min-height:300px}.loc{display:flex;align-items:center;gap:8px;font:700 29px Georgia,serif}.heart{color:#ff9b9b}.date{text-transform:capitalize;opacity:.88;margin-top:5px;font-size:15px}.heroGrid{display:grid;grid-template-columns:1fr 210px;align-items:center;margin-top:10px}.temp{font-size:108px;line-height:.88;font-weight:300;letter-spacing:-7px;text-shadow:0 8px 28px rgba(0,0,0,.12)}.temp sup{font-size:.4em;vertical-align:top;margin-left:7px}.conditionText{font-size:27px;font-weight:780;line-height:1.05;margin-top:10px;text-shadow:0 4px 18px rgba(0,0,0,.08)}.heroIcon{display:flex;align-items:center;justify-content:center}.heroIcon .wi{width:190px;height:190px;filter:drop-shadow(0 16px 28px rgba(0,66,110,.22))}.conf{font-size:12px;margin-top:10px;opacity:.93}.pill{display:inline-block;margin-left:5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.17)}.pill.Alta{background:rgba(59,213,141,.38)}.pill.Bassa{background:rgba(255,166,85,.4)}.glass{background:linear-gradient(140deg,rgba(255,255,255,.18),rgba(255,255,255,.085));border:1px solid rgba(255,255,255,.22);box-shadow:0 18px 55px rgba(5,41,70,.18),inset 0 1px 0 rgba(255,255,255,.24);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-radius:22px;overflow:hidden;margin-top:-3px}.metric{padding:14px 7px;text-align:center}.metric+.metric{border-left:1px solid rgba(255,255,255,.14)}.metric span{display:block;font-size:14px;opacity:.76}.metric b{font-size:21px}.card{margin-top:16px;border-radius:28px;padding:20px 14px}.title{display:flex;justify-content:space-between;align-items:center;padding:0 5px 12px}.title b{font-size:24px}.title span{font-size:13px;opacity:.72}.hours{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.hours::-webkit-scrollbar{display:none}.hour{min-width:96px;text-align:center;border-radius:18px;padding:9px 6px 10px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}.hour.now{background:linear-gradient(180deg,rgba(88,190,255,.46),rgba(255,255,255,.12));border-color:rgba(255,255,255,.28)}.hour span,.hour small{display:block;font-size:14px;opacity:.85}.hour b{font-size:27px}.hour .wi{width:76px;height:76px;margin:5px auto 1px}.hour small{height:14px;margin-top:3px;color:#d9efff}.day{display:grid;grid-template-columns:84px 72px 1fr 48px 50px;gap:10px;align-items:center;padding:14px 8px;border-top:1px solid rgba(255,255,255,.13)}.day .wi{width:68px;height:68px}.dn b,.dn small,.desc small{display:block;text-transform:capitalize}.dn b{font-size:18px}.dn small,.desc small{font-size:12px;opacity:.68;margin-top:2px}.desc{font-size:16px;font-weight:650}.min{color:#cce7ff;text-align:right;font-size:20px}.max{color:#ffe17e;text-align:right;font-size:21px}.nav{position:fixed;z-index:20;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 22px),690px);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 7px;border-radius:26px;background:rgba(5,31,51,.77);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(30px);box-shadow:0 16px 55px rgba(0,0,0,.23)}.nav button{border:0;background:transparent;color:#d7e9f6;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}.nav button.on{color:#fff3a4}.nav i{font-style:normal;font-size:23px}.sheetBg{position:fixed;z-index:100;inset:0;background:rgba(3,17,28,.48);backdrop-filter:blur(9px);display:flex;align-items:flex-end}.sheet{width:min(100%,720px);margin:auto;background:#123c5b;border-radius:30px 30px 0 0;padding:19px 16px calc(27px + env(safe-area-inset-bottom));max-height:82svh;overflow:auto}.sheetHead{display:flex;align-items:center;justify-content:space-between;font-size:19px}.sheetHead button{border:0;background:rgba(255,255,255,.1);color:white;width:38px;height:38px;border-radius:50%}.searchbox{margin-top:15px;padding:13px 14px;border-radius:17px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);display:flex;gap:9px}.searchbox input{flex:1;border:0;outline:0;background:transparent;color:white;font-size:16px}.searchbox input::placeholder{color:#bad0df}.geo{width:100%;margin-top:11px;padding:12px;border-radius:16px;border:0;background:rgba(67,169,235,.22);color:white}.results button{width:100%;text-align:left;border:0;border-top:1px solid rgba(255,255,255,.09);background:transparent;color:white;padding:13px 5px}.results b,.results small{display:block}.results small{opacity:.64;margin-top:2px}.loading{min-height:100svh;display:grid;place-content:center;text-align:center;background:linear-gradient(180deg,#168bd5,#6bc2e9);color:white}.loading h1{font:700 31px Georgia,serif;margin:13px 0 3px}.loading p{opacity:.78;font-size:13px}.error{padding:50px 20px;text-align:center}.error button{padding:12px 18px;border:0;border-radius:14px}@keyframes fall{to{background-position:90px 130px}}@media(max-width:430px){.brand{font-size:32px}.tag{font-size:8px}.hero{min-height:276px}.heroGrid{grid-template-columns:1fr 160px}.temp{font-size:94px}.conditionText{font-size:23px}.heroIcon .wi{width:152px;height:152px}.metric b{font-size:15px}.day{grid-template-columns:72px 64px 1fr 44px 46px}.day .wi{width:60px;height:60px}.title b{font-size:22px}}</style></head><body><div id="app"><div class="loading"><h1>My Weather</h1><p>Sto preparando la previsione…</p></div></div><script>const $=s=>document.querySelector(s); const app=$('#app');const DEFAULT={name:'Lodi',admin1:'Lombardia',country:'Italia',latitude:45.3136,longitude:9.5037,timezone:'Europe/Rome'};const MODELS=['italia_meteo_arpae_icon_2i','dwd_icon_eu','ecmwf_ifs025'];let loc=JSON.parse(localStorage.getItem('mw-location')||'null')||DEFAULT, weather=null;const mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0; const med=a=>{if(!a.length)return 0;let s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};function label(c){if(c===0)return'Sereno';if(c<=2)return'Parzialmente nuvoloso';if(c===3)return'Cielo nuvoloso';if(c>=95)return'Temporali';if(c>=71&&c<=77)return'Neve';if(c>=80&&c<90)return'Rovesci';if(c>=51&&c<80)return'Pioggia';if(c>=45&&c<=48)return'Nebbia';return'Variabile'}function cls(c,day=1){if(!day)return'night';if(c===3)return'cloudy';if(c>=95)return'storm';if(c>=71&&c<=77)return'snow';if(c>=51)return'rain';return'sunny'}function wi(code){let body='';const cloud=`<g filter="url(#shadow)"><ellipse cx="28" cy="35" rx="17" ry="10" fill="url(#cloudGrad)"/><circle cx="19" cy="33" r="9" fill="url(#cloudGrad)"/><circle cx="29" cy="27" r="12" fill="url(#cloudGrad)"/><circle cx="39" cy="33" r="9" fill="url(#cloudGrad)"/></g>`;const sun=`<g filter="url(#sunGlow)"><circle cx="21" cy="19" r="10" fill="url(#sunGrad)"/><g stroke="#ffd13b" stroke-width="2.2" stroke-linecap="round"><path d="M21 3v5M21 30v5M5 19h5M32 19h5M10 8l4 4M28 26l4 4M32 8l-4 4M14 26l-4 4"/></g></g>`;if(code===0)body=sun;else if(code>=95)body=cloud+`<path d="M28 35l-6 9h6l-4 8 12-13h-7l5-4" fill="url(#boltGrad)" filter="url(#shadow)"/>`;else if(code>=71&&code<=77)body=cloud+`<g fill="#f3fbff" filter="url(#shadow)"><circle cx="17" cy="45" r="2.5"/><circle cx="28" cy="48" r="2.5"/><circle cx="39" cy="44" r="2.5"/></g>`;else if(code>=51)body=cloud+`<g stroke="#54c6ff" stroke-width="3.4" stroke-linecap="round" filter="url(#shadow)"><path d="M17 42l-3 7"/><path d="M28 42l-3 7"/><path d="M39 42l-3 7"/></g>`;else if(code===3)body=cloud;else body=sun+cloud;return `<svg class="wi" viewBox="0 0 56 56" aria-hidden="true"><defs><radialGradient id="sunGrad" cx="35%" cy="30%"><stop offset="0" stop-color="#fff8a6"/><stop offset=".38" stop-color="#ffd83f"/><stop offset="1" stop-color="#ff9f0a"/></radialGradient><linearGradient id="cloudGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#dceeff"/><stop offset="1" stop-color="#9fbfd7"/></linearGradient><linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff47a"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#163d59" flood-opacity=".28"/></filter><filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#ffb300" flood-opacity=".45"/></filter></defs>${body}</svg>`}function derive(codes,pop,cloud,temp){let storm=codes.filter(c=>c>=95).length,snow=codes.filter(c=>c>=71&&c<=77).length,rain=codes.filter(c=>c>=51&&c<95).length;if(storm&&pop>=60)return 95;if(snow&&temp<=2&&pop>=40)return 73;if(rain&&pop>=60)return 61;if(rain&&pop>=35)return 80;if(cloud>=82)return 3;if(cloud>=45)return 2;if(cloud>=18)return 1;return 0}function confidence(ts,ps,codes){if(ts.length<2)return'Media';let spread=Math.max(...ts)-Math.min(...ts),pd=Math.max(...ps)-Math.min(...ps),rain=codes.map(c=>c>=51?1:0),agree=Math.max(rain.filter(x=>x===0).length,rain.filter(x=>x===1).length)/rain.length,score=100-spread*7-pd*.35-(1-agree)*45;return score>=78?'Alta':score>=58?'Media':'Bassa'}async function getModel(model){const u=new URL('https://api.open-meteo.com/v1/forecast');u.searchParams.set('latitude',loc.latitude);u.searchParams.set('longitude',loc.longitude);u.searchParams.set('timezone',loc.timezone||'auto');u.searchParams.set('forecast_days','8');u.searchParams.set('hourly','temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,relative_humidity_2m,is_day');if(model)u.searchParams.set('models',model);let r=await fetch(u);if(!r.ok)throw Error(model||'best');return r.json()}async function load(){app.innerHTML='<div class="loading"><h1>My Weather</h1><p>Sto preparando la previsione…</p></div>';try{let settled=await Promise.allSettled([...MODELS.map(getModel),getModel(null)]),models=settled.filter(x=>x.status==='fulfilled').map(x=>x.value).filter(x=>x.hourly?.time?.length);if(!models.length)throw Error();weather=consensus(models);render()}catch(e){app.innerHTML='<div class="error"><h2>Dati meteo non disponibili</h2><p>Controlla la connessione e riprova.</p><button onclick="load()">Riprova</button></div>'}}function consensus(models){let base=models[0].hourly;let hourly=base.time.map((time,i)=>{let v=models.map(m=>{let h=m.hourly,j=h.time.indexOf(time);if(j<0)return null;return{t:h.temperature_2m[j],a:h.apparent_temperature[j],p:h.precipitation_probability[j]??0,mm:h.precipitation[j]??0,c:h.weather_code[j]??0,cl:h.cloud_cover[j]??0,w:h.wind_speed_10m[j]??0,g:h.wind_gusts_10m[j]??0,hu:h.relative_humidity_2m[j]??0,d:h.is_day[j]??1}}).filter(Boolean);let ts=v.map(x=>x.t),ps=v.map(x=>x.p),codes=v.map(x=>x.c),cloud=mean(v.map(x=>x.cl));return{time,temp:mean(ts),feels:mean(v.map(x=>x.a)),pop:Math.round(med(ps)),precip:mean(v.map(x=>x.mm)),code:derive(codes,med(ps),cloud,mean(ts)),cloud:Math.round(cloud),wind:Math.round(mean(v.map(x=>x.w))),gust:Math.round(mean(v.map(x=>x.g))),humidity:Math.round(mean(v.map(x=>x.hu))),isDay:Math.round(mean(v.map(x=>x.d))),confidence:confidence(ts,ps,codes)}});let map={};hourly.forEach(h=>(map[h.time.slice(0,10)]??=[]).push(h));let daily=Object.entries(map).slice(0,7).map(([date,hs])=>{let t=hs.map(x=>x.temp),mid=hs.filter(x=>+x.time.slice(11,13)>=10&&+x.time.slice(11,13)<=18),codes=(mid.length?mid:hs).map(x=>x.code),code=codes.sort((a,b)=>codes.filter(v=>v===a).length-codes.filter(v=>v===b).length).pop();return{date,min:Math.round(Math.min(...t)),max:Math.round(Math.max(...t)),code,pop:Math.max(...hs.map(x=>x.pop)),confidence:hs.filter(x=>x.confidence==='Alta').length>=hs.length/2?'Alta':hs.filter(x=>x.confidence==='Bassa').length>=hs.length/2?'Bassa':'Media'}});let now=new Date().toLocaleString('sv-SE',{timeZone:loc.timezone||'Europe/Rome'}).replace(' ','T').slice(0,13)+':00',current=hourly.find(h=>h.time>=now)||hourly[0];return{hourly:hourly.slice(0,72),daily,current,count:models.length}}function dn(date,i){if(i===0)return'Oggi';if(i===1)return'Domani';return new Intl.DateTimeFormat('it-IT',{weekday:'short'}).format(new Date(date+'T12:00')).replace('.','')}function render(){let c=weather.current;app.innerHTML=`<main class="app ${cls(c.code,c.isDay)}"><div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="rainfx"></div></div><div class="wrap"><header><div><div class="brand">My Weather</div><div class="tag">UN GIORNO PIÙ LUMINOSO</div></div><div class="topBtns"><button class="round" id="search">⌕</button><button class="round" id="add">＋</button></div></header><section class="hero"><div class="loc"><span>⌖</span>${loc.name}<span class="heart">♥</span></div><div class="date">${new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</div><div class="heroGrid"><div><div class="temp">${Math.round(c.temp)}<sup>°C</sup></div><div class="conditionText">${label(c.code)}</div><div class="conf">Affidabilità previsione: <b class="pill ${c.confidence}">${c.confidence}</b></div></div><div class="heroIcon">${wi(c.code)}</div></div></section><section class="metrics glass"><div class="metric"><span>Percepita</span><b>${Math.round(c.feels)}°</b></div><div class="metric"><span>Pioggia</span><b>${c.pop}%</b></div><div class="metric"><span>Vento</span><b>${c.wind} km/h</b></div></section><section class="card glass"><div class="title"><b>Previsioni orarie</b><span>Vedi dettagli</span></div><div class="hours">${weather.hourly.slice(0,10).map((h,i)=>`<div class="hour ${i===0?'now':''}"><span>${i===0?'Ora':h.time.slice(11,16)}</span>${wi(h.code)}<b>${Math.round(h.temp)}°</b><small>${h.pop?`${h.pop}%`:''}</small></div>`).join('')}</div></section><section class="card glass"><div class="title"><b>Previsione 7 giorni</b><span>Affidabilità: ${weather.daily[0]?.confidence||'Media'}</span></div>${weather.daily.map((d,i)=>`<div class="day"><div class="dn"><b>${dn(d.date,i)}</b><small>${new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short'}).format(new Date(d.date+'T12:00'))}</small></div>${wi(d.code)}<div class="desc">${label(d.code)}<small>${d.pop>20?'Pioggia '+d.pop+'%':d.confidence+' affidabilità'}</small></div><span class="min">${d.min}°</span><b class="max">${d.max}°</b></div>`).join('')}</section></div><nav class="nav"><button class="on"><i>⌂</i>Oggi</button><button><i>▦</i>Settimana</button><button id="fav"><i>♡</i>Preferiti</button><button><i>⚙</i>Impostazioni</button></nav></main>`;['search','add','fav'].forEach(id=>document.getElementById(id)?.addEventListener('click',openSearch))}function openSearch(){document.body.insertAdjacentHTML('beforeend',`<div class="sheetBg" id="sheetBg"><div class="sheet"><div class="sheetHead"><b>Scegli una località</b><button id="close">✕</button></div><div class="searchbox"><span>⌕</span><input id="q" placeholder="Cerca città…" autocomplete="off"></div><button class="geo" id="geo">⌖ Usa la mia posizione</button><div class="results" id="results"></div></div></div>`);$('#close').onclick=closeSearch;$('#sheetBg').onclick=e=>{if(e.target.id==='sheetBg')closeSearch()};let input=$('#q'),timer;input.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>searchCity(input.value),250)};$('#geo').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{choose({name:'La mia posizione',latitude:p.coords.latitude,longitude:p.coords.longitude,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone})})}function closeSearch(){$('#sheetBg')?.remove()}async function searchCity(q){if(q.trim().length<2){$('#results').innerHTML='';return}let u=new URL('https://geocoding-api.open-meteo.com/v1/search');u.searchParams.set('name',q);u.searchParams.set('count','7');u.searchParams.set('language','it');let r=await fetch(u),j=await r.json();$('#results').innerHTML=(j.results||[]).map((x,i)=>`<button data-i="${i}"><b>${x.name}</b><small>${[x.admin1,x.country].filter(Boolean).join(', ')}</small></button>`).join('');[...$('#results').children].forEach((b,i)=>b.onclick=()=>choose(j.results[i]))}function choose(x){loc={name:x.name,admin1:x.admin1,country:x.country,latitude:x.latitude,longitude:x.longitude,timezone:x.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone};localStorage.setItem('mw-location',JSON.stringify(loc));closeSearch();load()}load();</script></body></html>
