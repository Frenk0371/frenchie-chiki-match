name: Publish VideotekApp APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-videotekapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download corrected VideotekApp artifact
        run: |
          set -e
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-bbec-81f4-bb7b-351f483a821e/raw?se=2026-09-13T12%3A33%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=8c925b5d-48a3-5803-9ab4-0c34ad61a342&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T07%3A45%3A54Z&ske=2026-09-14T07%3A45%3A54Z&sks=b&skv=2026-02-06&sig=yz8Giq%2BqusIQVDxpImOIkfMEdZ8umAVfzgnAs/jhnF8%3D' -o /tmp/videotek.zip
          rm -rf /tmp/videotek-unzip
          mkdir -p /tmp/videotek-unzip
          unzip -o /tmp/videotek.zip -d /tmp/videotek-unzip
          APK=$(find /tmp/videotek-unzip -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p downloads/videotekapp
          cp "$APK" downloads/videotekapp/VideotekApp-0.4.3-logo2.apk

      - name: Commit corrected APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/videotekapp/VideotekApp-0.4.3-logo2.apk
          git commit -m 'Publish corrected VideotekApp 0.4.3 branding APK' || exit 0
          git push
