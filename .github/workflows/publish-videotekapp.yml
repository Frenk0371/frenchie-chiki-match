name: Publish VideotekApp APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-videotekapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create versioned APK URL
        run: |
          set -e
          test -f downloads/videotekapp/latest.apk
          cp downloads/videotekapp/latest.apk downloads/videotekapp/VideotekApp-0.4.3.apk

      - name: Commit versioned APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/videotekapp/VideotekApp-0.4.3.apk
          git commit -m 'Add versioned VideotekApp 0.4.3 APK' || exit 0
          git push
