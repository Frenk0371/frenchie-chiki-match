name: Publish TV App Italia v0.9.9 APK

on:
  push:
    paths:
      - '.github/workflows/publish-tvapp-v099.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact verified v0.9.9 artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-3838-81fb-995f-2f179aaa0887/raw?se=2026-09-09T16%3A36%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=f8881033-6466-5774-a665-c63294715c84&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T07%3A36%3A23Z&ske=2026-09-10T07%3A36%3A23Z&sks=b&skv=2026-02-06&sig=s85IWwGW0GWt9uqy2QRZSd/QVqktjeTnG0xH1WSMY%2Bk%3D'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/tvapp.zip
          mkdir -p /tmp/tvapp
          unzip -q /tmp/tvapp.zip -d /tmp/tvapp
          APK=$(find /tmp/tvapp -type f -name '*.apk' | head -n1)
          test -n "$APK"
          ACTUAL_SHA=$(sha256sum "$APK" | awk '{print $1}')
          EXPECTED_SHA='c9544f7ed21db06fa00965dec61a33847f74fa96e54f84c10d8795c84ef9fd7b'
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(stat -c%s "$APK")" = '1304733'
          mkdir -p public downloads/tv-app-italia
          cp "$APK" public/tvapp.apk
          cp "$APK" downloads/tv-app-italia/latest.apk
          printf '%s\n' "$ACTUAL_SHA" > public/tvapp.sha256
          echo 'TV App Italia Android TV v0.9.9 - 30 channels' > public/tvapp-version.txt

      - name: Commit exact APK to public repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/tvapp.apk public/tvapp.sha256 public/tvapp-version.txt downloads/tv-app-italia/latest.apk
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Publish TV App Italia Android TV v0.9.9 30ch APK'
            git push
          fi
