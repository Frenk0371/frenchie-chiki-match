name: Verify public TV App Italia APK URL

on:
  push:
    paths:
      - '.github/workflows/verify-tvapp-public.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download public raw APK and verify
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/Frenk0371/frenchie-chiki-match/main/downloads/tv-app-italia/latest.apk'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/latest.apk
          test "$(stat -c%s /tmp/latest.apk)" = '1304733'
          echo 'c9544f7ed21db06fa00965dec61a33847f74fa96e54f84c10d8795c84ef9fd7b  /tmp/latest.apk' | sha256sum -c -
