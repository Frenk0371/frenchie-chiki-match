name: Publish TV App Italia APK

on:
  push:
    branches:
      - tvapp-publish-temp
    paths:
      - '.github/workflows/publish-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy verified APK from public distribution branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tvapp-publish-temp
          mkdir -p public
          git show origin/tvapp-publish-temp:downloads/TV-App-Italia-v0.9.6-Premium-TV.apk > public/tvapp.apk
          test "$(stat -c%s public/tvapp.apk)" = "1303645"
          test "$(sha256sum public/tvapp.apk | awk '{print $1}')" = "98af71def2d6cc7d7723c4f08e61f212c35a2dbec4effd9c34ae4ab0dffb39aa"

      - name: Publish static APK without changing app UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tvapp.apk
          if git diff --cached --quiet; then
            echo "Static APK already current"
          else
            git commit -m "Host TV App Italia v0.9.6 Premium APK"
            git push origin HEAD:main
          fi
